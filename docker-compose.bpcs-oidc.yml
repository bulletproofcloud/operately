services:
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: >-
        {"interactiveLogin": false,
         "tokenCallbacks": [{"issuerId": "default", "tokenExpiry": 300,
           "requestMappings": [{"requestParam": "client_id", "match": "*",
             "claims": {"sub": "e2e-user", "email": "e2e@example.localhost", "email_verified": true,
                        "name": "E2E User", "aud": ["operately-e2e"]}}]}]}
    profiles: ["ci", "dev"]

  app:
    environment:
      - OIDC_ISSUER_URL=http://oidc:8080/default
      - OIDC_CLIENT_ID=operately-e2e
      - OIDC_CLIENT_SECRET=e2e-secret
